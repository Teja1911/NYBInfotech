<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Symbols in HTML -->
    <p>The copy right symbol: &copy;</p>
    <p>The greater than symbol: &gt;</p>
    <p>The less than symbol&lt;</p>
    <p>The blank space &nbsp;</p>
    <p>The double quot symbol: &quot;</p>
    <p>The ampersand symbol: &amp;</p>
    <p>The single quot symbol: &apos;</p>
    <p>The registered trademark symbol: &reg;</p>
</body>
</html>

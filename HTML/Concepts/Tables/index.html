<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <caption>Empolyee Details:</caption>
    <table border="1" style="border-collapse: collapse; border-color: black;">
       <thead>
            <tr>
                <th rowspan="2">Name</th>
                <th rowspan="2">Age</th>
                <th colspan="2">Location</th>  
            </tr>
            <tr>
                <th>City</th>
                <th>Pincode</th>
            </tr>
        </thead> 
        <tbody>
            <tr>
                <td>Teja</td>
                <td>22</td>
                <td>Hyderabad</td>
                <td>500001</td>
            </tr>
            <tr>
                <td>Surya</td>
                <td>23</td>
                <td>Hyderabad</td>
                <td>500001</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td rowspan="4">Total employees</td>
                <td colspan="3">2</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <caption>Student Registration Form:</caption>
    <br><br>
    <!-- id and for should have the same name because when we click on the (i.e text box it should get focused) -->
    <!-- In the button we use the value attribute  -->
    <!-- name attribute is used for the backend  -->
    <form action="" >
        <label for="username">User Name:</label>
        <input type="text" id="username" placeholder="User Name" required maxlength="15">
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter your email" required>
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter your password"  pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*()_-]).{8,}$" required>
        <br><br>
        <!-- Radio Button  -->
        <label for="gender">Select the Gender:</label><br><br>
        <div class="gender">
            <input type="radio" value="Male" id="Male" name="gender" required>
            <label for="Male">Male</label><br><br>
            <input type="radio" value="Female" id="Female" name="gender" required>
            <label for="gender">Female</label><br><br>
            <input type="radio" value="Others" id="Others" name="gender" required>
            <label for="gender">Others</label>   
        </div>
        <br>
        <!-- Check Box -->
        <label for="Skills">Skills:</label><br><br>
        <input type="checkbox" id="HTML" name="Skills" value="HTML">
        <label for="HTML">HTML</label><br><br>
        <input type="checkbox" id="CSS" name="Skills" value="CSS">
        <label for="CSS">CSS</label><br><br>
        <input type="checkbox" id="JS" name="Skills" value="JS">
        <label for="JS">JS</label><br><br>
        <input type="checkbox" id="React" name="Skills" value="React">
        <label for="React">React</label><br><br>
        <input type="checkbox" id="SQL" name="Skills" value="SQL">
        <label for="SQL">SQL</label><br><br>
        <input type="checkbox" id="MongoDB" name="Skills" value="MongoDB">
        <label for="MongoDB">MongoDB</label><br><br>
        <input type="checkbox" id="Git" name="Skills" value="Git">
        <label for="Git">Git</label><br><br>
        <!-- Drop Down -->
        <label for="Country">Select the Country: </label>
        <select name="Country" id="Country">
            <option value="">Select the Country</option>
            <option value="India">India</option>
            <option value="USA">USA</option>
            <option value="UK">UK</option>
            <option value="London">London</option>
        </select>
        <br><br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>

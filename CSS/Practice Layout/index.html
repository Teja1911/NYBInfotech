<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            display: grid;/*It will take elements in column wise*/
        }
    </style>
</head>
<body>
    <div>
        <div style="background-color: blueviolet; align-items: center; padding-left: 20px;">
            <p style="font-size: larger; font-family: Arial, Helvetica, sans-serif;">Logo</p>
        </div>
        <div style="background-color: blueviolet;  align-items: center; justify-content: center; margin-top: 5px; ">
            <p style="font-size: larger; font-family: Arial, Helvetica, sans-serif; margin: 0;">Navigation</p>
        </div>
        <div style="background-color: blueviolet; margin-top: 5px; align-items: center; justify-content: center; height: 100px;">
            <p style="font-size: larger;font-family: Arial, Helvetica, sans-serif;">Header / Banner</p>
        </div>
        <div style="display: flex; gap: 20px; justify-content:center; align-items:center; font-family: Arial, Helvetica, sans-serif;">
            <p style="display: flex; justify-content: center; align-items: center; width: 40%; margin-right: 0; height: 100px; background-color: blueviolet; text-align: center; padding-top: 20%; padding-bottom: 20%;">Side Bar</p>
            <p style="display: flex; justify-content: center; align-items: center; width: 75%; margin-left: 0; height: 100px; background-color: blueviolet; text-align: center; padding: 20%;" >Body Area</p>
        </div>
        <div style="background-color: blueviolet; align-items: center; justify-content: center;">
            <p style="font-size: x-large; font-family: Arial, Helvetica, sans-serif; margin: 0;">Footer</p>
        </div>
    </div>
</body>
</html>

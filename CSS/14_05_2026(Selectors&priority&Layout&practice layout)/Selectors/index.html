<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button:hover{ 
            color: brown;
            background-color: black;
        }
        button::first-letter{
            color: rgb(248, 244, 244);
        }
        .next{
            color: rgb(17, 224, 79);
            margin: 2px;
        }
        .previous{
            color: rgb(34, 31, 211);
        }
    </style>
</head>
<body>
    <h1 style="color: blueviolet; font-size: small; font-style: italic;">Lorem ipsum dolor sit amet.</h1>
    <p style="color: brown; font-size: larger; font-family: 'Times New Roman', Times, serif; text-align: center; text-transform: capitalize;">Lorem ipsum dolor sit amet.</p>
    <div>
        <button class="next">Next One</button>
    </div>
    <div>
        <button class="previous">Previous</button>
    </div>
    <div>
        <button class="next">Next</button>
    </div>
    <div>
        <button class="previous">Previous</button>
    </div>
    <div>
        <button class="next">Next</button>
    </div>
    <div>
        <button class="previous">Previous</button>
    </div>
</body>
</html>

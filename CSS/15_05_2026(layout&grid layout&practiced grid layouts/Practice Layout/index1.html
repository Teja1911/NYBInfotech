<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            display: grid;
        }
    </style>
</head>
<body>
    <div>
        <div style="background-color: blueviolet; display: flex; align-items: center; justify-content: space-between;">
            <p style="padding-left: 10px; font-family: Arial, Helvetica, sans-serif; font-size: larger;">Logo</p>
            <p style="padding-right: 15%; font-family:Arial, Helvetica, sans-serif; font-size: larger;">Navigation</p>
        </div>
        <div style="align-items: center; justify-content: center; background-color: blueviolet; margin-top: 10px;">
            <p style="height: 60px; display: flex; align-items: center; justify-content: center; font-family: Arial, Helvetica, sans-serif; font-size: larger;">Header / Banner</p>
        </div>
        <div style="background-color: blueviolet; align-items: center; justify-content: center; margin-top: 10px;">
            <p style="height: 50px; display: flex; align-items: center; justify-content: center; font-family: Arial, Helvetica, sans-serif; font-size: larger;">Intro Text Area</p>
        </div>
        <div style="display: flex; gap: 10px; align-items: center; justify-content: space-between;">
            <p style="height: 400px; width: 30%; background-color: blueviolet; display: flex; align-items: center; justify-content: center; font-family: Arial, Helvetica, sans-serif; font-size: larger;">Box1</p>
            <p style="height: 400px; width: 30%; background-color: blueviolet; display: flex; align-items: center; justify-content: center; font-family: Arial, Helvetica, sans-serif; font-size: larger;">Box2</p>
            <p style="height: 400px; width: 30%; background-color: blueviolet; display: flex; align-items: center; justify-content: center; font-family: Arial, Helvetica, sans-serif; font-size: larger;">Box3</p>
        </div>
        <div style="background-color: blueviolet; align-items: center; justify-content: center;">
            <p style="font-size: larger; font-family: Arial, Helvetica, sans-serif; margin: 0;">Footer</p>
        </div>

    </div>
</body>
</html>

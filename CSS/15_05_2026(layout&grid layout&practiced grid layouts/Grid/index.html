<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: brown;
            padding: 2px;
            margin: 5px;
            border: 5px solid black;
        }
        #div{
            display: grid;
            grid-template-columns: 1fr 2fr ; /*fr will make the entire width into the fractions */
            /* grid-template-rows: 100px 200px 150px; */
            
        }
        #box1{
            /* grid-column-start: 1;
            grid-column-end: 3; */
            grid-column: 1/-1; /*-1 means last grid* if we give this we don't need count the number of columns it will automatically takes the last grid*/
        }
    </style>
</head>
<body>
    <div style="background-color: blueviolet; height: 400px; width: 500px;" id="div">
        <div class="box" id="box1">
            box1
        </div>
        <div class="box" id="box2">
            box2
        </div>
        <div class="box" id="box3">
            box3
        </div>
        <div class="box" id="box4">
            box4
        </div>
        <div class="box" id="box5">
            box5
        </div>
    </div>
</body>
</html>

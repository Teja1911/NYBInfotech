<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Columns = Width distribution
        Rows = Height distribution
        grid-column = horizontal span
        grid-row = vertical span */
        .main{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr ;
            grid-template-rows: 50px 100px 70px 300px 30px;
            gap: 10px 100px;
        }
        #logo{
            grid-column: 1/-1;
            background-color: blueviolet;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 20px;
            padding-right: 100px;
            font-size: larger;
            font-family: 'Times New Roman', Times, serif;
        }
        #header{
            grid-column: 1/-1;
            background-color: blueviolet;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: larger;
            font-family: 'Times New Roman', Times, serif;
        }
        #textarea{
            grid-column: 1/-1;
            background-color: blueviolet;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: larger;
            font-family: 'Times New Roman', Times, serif;
        }
        #box1{
            grid-column: 1/3;
            background-color: blueviolet;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: larger;
            font-family: 'Times New Roman', Times, serif;
        }
        #box2{
            grid-column: 3/5;
            background-color: blueviolet;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: larger;
            font-family: 'Times New Roman', Times, serif;
        }
        #box3{
            grid-column: 5/7;
            background-color: blueviolet;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: larger;
            font-family: 'Times New Roman', Times, serif;
        }
        #footer{
            grid-column: 1/-1;
            background-color: blueviolet;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: larger;
            font-family: 'Times New Roman', Times, serif;        
        }
    </style>
</head>
<body>
    <div class="main">
        <div id="logo">
            <div>Logo</div>
            <div>Navigation</div> </div>
        <!-- <div id="navigation">Navigation</div> -->
        <div id="header">Header / Banner</div>
        <div id="textarea">Intro Text Area</div>
        <div id="box1">Box1</div>
        <div id="box2">Box2</div>
        <div id="box3">Box3</div>
        <div id="footer">Footer</div>
    </div>
</body>
</html>

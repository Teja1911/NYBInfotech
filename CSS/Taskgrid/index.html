<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            display: grid;
            grid-template-columns: 1fr 3fr;
            grid-template-rows: 
            80px
            500px
            80px;
            gap: 5px;
        }
        #div1{
            grid-column: 1/-1;
            margin-bottom: 5px;
            background-color: blueviolet;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #div2{
            grid-column: 1/2;
            background-color: blueviolet;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #div3{
            background-color: blueviolet;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #div4{
            background-color: blueviolet;
            margin-top: 5px;
            grid-column: 1/-1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="main">
        <div id="div1"><p style="font-size: larger; font-family: 'Times New Roman', Times, serif;">Header</p></div>
        <div id="div2"><p style="font-size: larger; font-family: 'Times New Roman', Times, serif;">Side Bar</p></div>
        <div id="div3"><p style="font-size: larger; font-family: 'Times New Roman', Times, serif;">Main Body</p></div>
        <div id="div4"><p style="font-size: larger; font-family: 'Times New Roman', Times, serif;">Footer</p></div>
    </div>
</body>
</html>
